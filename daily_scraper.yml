name: Daily Social Work & NGO Job Scraper

on:
  schedule:
    # 매일 한국 시간 오전 8시(UTC 23:00)에 자동 실행
    - cron: '0 23 * * *'
  # 깃허브 웹 화면에서 'Run workflow' 버튼으로 언제든 수동 즉시 실행 가능
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: 3대 영역(복지관·NGO·CSR) 공고 자동 수집 및 동기화 실행
        run: |
          python scripts/auto_scrape.py
